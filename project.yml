name: Shiyin
options:
  bundleIdPrefix: com.shiyin
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.6"
    CURRENT_PROJECT_VERSION: "15"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  Shiyin:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    info:
      path: .generated/Info.plist
      properties:
        CFBundleDisplayName: 姊︾闊充箰
        CFBundleName: Shiyin
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIBackgroundModes:
          - audio
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: 鎷鹃煶闇€瑕佸湪灞€鍩熺綉鍐呭彂鐜颁綘鐨勭數鑴戯紝浠ヤ笅杞介煶涔愭枃浠跺埌鎵嬫満銆?        NSBonjourServices:
          - _shiyin._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_NAME: Shiyin
        PRODUCT_BUNDLE_IDENTIFIER: com.shiyin.player
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
